# Ejecuta los tests de ARGOS cuando cambia algo dentro de argos/.
name: ARGOS tests

on:
  push:
    paths: ["argos/**", ".github/workflows/argos-tests.yml"]
  pull_request:
    paths: ["argos/**", ".github/workflows/argos-tests.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: argos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: pytest
